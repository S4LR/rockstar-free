name: Build Rockstar Client

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 8

    - name: Grant Gradle permission
      run: chmod +x gradlew

    - name: Build
      run: ./gradlew build
